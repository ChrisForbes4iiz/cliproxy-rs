[package]
name = "cpa-core"
description = "Part of cliproxy: config, credentials, formats and the execution envelope"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
exclude.workspace = true
keywords = ["llm", "proxy", "cliproxy", "config"]
categories.workspace = true

[features]
# Lets a test install a plugin auth parser for its own thread only
# (`credentials::with_thread_plugin_auth_parser`), so tests sharing a process do not see it.
test-support = []

[dependencies]
anyhow.workspace = true
bytes.workspace = true
futures-util.workspace = true
http.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tracing.workspace = true
base64 = "0.22"
bcrypt = "0.19"
sha2 = "0.10"
yaml-edit = "0.3.2"
# cpa_core::yaml: the safe-Rust YAML parser, and the crates of serde_yaml_ng's Value.
granit-parser = { version = "=2.1.0", default-features = false, features = ["std", "error_messages"] }
indexmap = "2"
itoa = "1"
ryu = "1"
